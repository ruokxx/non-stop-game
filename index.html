<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nonstop" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Nonstop – Partyspiel</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --danger: #f43f5e;
      --adult: #ec4899;
      --special: #f59e0b;
      --success: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
      padding: max(8px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom)) 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    /* Header & Copyright */
    header {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 0;
      gap: 8px;
    }

    .brand-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .logo {
      font-size: clamp(1.2rem, 3.5vh, 1.45rem);
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.05;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .copyright {
      font-size: 0.65rem;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.3px;
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      border-radius: 11px;
      padding: 7px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .icon-btn.active-adult {
      background: rgba(236, 72, 153, 0.2);
      border-color: var(--adult);
      color: #f9a8d4;
    }

    /* Main Arena – passt sich flexibel an den verbleibenden Platz an */
    main {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      gap: clamp(6px, 1.5vh, 14px);
      text-align: center;
      overflow: hidden;
    }

    .status-row {
      flex-shrink: 0;
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }

    .badge.adult {
      background: rgba(236, 72, 153, 0.2);
      color: #f472b6;
    }

    .badge.round-counter {
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
    }

    /* Spezial-Challenge Box */
    .special-box {
      display: none;
      flex-shrink: 1;
      width: 100%;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(217, 119, 6, 0.12));
      border: 1.5px solid var(--special);
      border-radius: 16px;
      padding: clamp(8px, 1.4vh, 12px) 14px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.18);
      animation: popIn 0.35s ease;
    }

    .special-box.visible {
      display: block;
    }

    .special-title {
      font-size: 0.68rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      color: #fbbf24;
      margin-bottom: 3px;
    }

    .special-text {
      font-size: clamp(0.82rem, 2vh, 0.96rem);
      font-weight: 700;
      color: #fef3c7;
      line-height: 1.25;
      margin: 0;
    }

    .category-box {
      flex: 0 1 auto;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: clamp(12px, 2.4vh, 22px) 16px;
      width: 100%;
      min-height: clamp(84px, 14vh, 130px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 30px -10px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .category-box.pulse {
      transform: scale(1.015);
      border-color: var(--accent);
    }

    .category-box.speaking {
      border-color: #fbbf24;
    }

    .category-text {
      font-size: clamp(1.2rem, 3.2vh, 1.6rem);
      font-weight: 800;
      line-height: 1.22;
      margin: 0;
    }

    /* Timer Circle – skaliert dynamisch mit der Bildschirmhöhe */
    .timer-wrapper {
      flex-shrink: 1;
      position: relative;
      width: clamp(125px, 21vh, 175px);
      height: clamp(125px, 21vh, 175px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg.progress-ring {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .progress-ring__bg {
      fill: transparent;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 11;
    }

    .progress-ring__circle {
      fill: transparent;
      stroke: var(--accent);
      stroke-width: 11;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.1s linear, stroke 0.3s ease;
    }

    .timer-display {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-seconds {
      font-size: clamp(2.1rem, 5vh, 3.1rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .timer-label {
      font-size: 0.66rem;
      color: var(--muted);
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 700;
    }

    .stats {
      flex-shrink: 0;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
    }

    /* Primary Action Button */
    .controls {
      flex-shrink: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-primary {
      width: 100%;
      padding: clamp(14px, 2.2vh, 18px);
      border-radius: 18px;
      border: none;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0f172a;
      font-size: clamp(1.08rem, 2.4vh, 1.25rem);
      font-weight: 900;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 8px 20px var(--accent-glow);
      transition: transform 0.1s ease;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-primary.speaking-state {
      background: linear-gradient(135deg, #d97706, #fbbf24);
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35);
    }

    .btn-primary.running {
      background: linear-gradient(135deg, #10b981, #34d399);
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
    }

    .sub-controls {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--card);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Settings Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #1e293b;
      width: 100%;
      max-width: 500px;
      border-radius: 28px 28px 0 0;
      padding: 22px 20px calc(22px + env(safe-area-inset-bottom)) 20px;
      max-height: 85dvh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal h2 {
      margin: 0;
      font-size: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-group label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 11px 13px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
    }

    .row-input {
      display: flex;
      gap: 8px;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92) translateY(-6px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.4s ease;
    }
  </style>
</head>

      "Diese Runde darfst du NICHT LACHEN oder grinsen – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du mit zugehaltener NASE sprechen – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du wie ein Roboter sprechen – sonst ziehst du eine Strafkarte!",
      "Diese Runde darfst du nur die LINKE HAND zum Ablegen benutzen – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du nach deinem Wort sofort in die HÄNDE KLATSCHEN – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du mit geschlossenen AUGEN spielen – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du vor deinem Wort ein Tiergeräusch machen – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du deinen rechten Nachbarn beim Antworten ANSTARREN – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du deine Antwort BRÜLLEN wie auf dem Marktplatz – sonst ziehst du eine Strafkarte!",
      "Diese Runde darfst du beim Sprechen die ZÄHNE nicht auseinander machen – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du beim Ablegen ein BEIN in die Luft heben – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du in ZEITLUPE sprechen und ablegen – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du nach dem Ablegen sofort auf den TISCH KLOPFEN – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du deine Antwort in einer FREMDSPRACHE oder mit starkem Akzent sagen – sonst Strafkarte!",
      "Diese Runde darfst du beim Spielen NICHT BLINZELN – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du eine Hand auf deinen KOPF legen – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du vor jedem Wort Chef oder Meister sagen – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du deine Antwort wie ein NACHRICHTENSPRECHER ansagen – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du deine Karten mit dem ELLBOGEN oder Handrücken ablegen – sonst Strafkarte!",
      "Diese Runde darfst du erst ablegen, wenn du dich einmal im KREIS gedreht hast – sonst Strafkarte!",
      "Diese Runde musst du beim Sprechen die ZUNGE rausstrecken – sonst ziehst du eine Strafkarte!",
      "Diese Runde musst du jedes Wort zweimal hintereinander sagen – sonst ziehst du eine Strafkarte!",
      "Diese Runde darfst du nur Antworten mit mindestens ZWEI SILBEN nennen – sonst Strafkarte!",
      "Diese Runde musst du so tun, als würdest du WEINEN, während du antwortest – sonst Strafkarte!",
      "Diese Runde musst du deine Karten unter dem TISCH halten, bis du ablegst – sonst Strafkarte!",
      "Diese Runde musst du nach deiner Antwort einen DAUMEN HOCH zeigen – sonst ziehst du eine Strafkarte!",
      "DOPPELTER EINSATZ: Wer am Ende dieser Runde noch Karten auf der Hand hat, zieht ZWEI Strafkarten!"
    ];

    // --- STATE ---
    let duration = parseInt(localStorage.getItem('nonstop_duration') || '10', 10);
    let specialInterval = parseInt(localStorage.getItem('nonstop_special_int') || '8', 10);
    let mode = localStorage.getItem('nonstop_mode') || 'standard';
    let speechEnabled = localStorage.getItem('nonstop_speech') || 'on';
    let customCategories = JSON.parse(localStorage.getItem('nonstop_custom') || '[]');

    let usedIndices = new Set();
    let usedSpecialIndices = new Set();
    let roundCount = 0;
    let currentCategory = "";
    let currentSpecial = "";
    let timerInterval = null;
    let timeLeft = duration;
    let audioCtx = null;
    let speechPollInterval = null;
    let activeSpeechId = 0;

    // SVG Ring Setup (via viewBox 0 0 175 175 exakt skaliert)
    const circle = document.getElementById('progressCircle');
    const radius = 75;
    const circumference = radius * 2 * Math.PI;
    circle.style.strokeDasharray = `${circumference} ${circumference}`;
    circle.style.strokeDashoffset = 0;

    // Init UI
    document.getElementById('durationSelect').value = duration;
    document.getElementById('specialIntervalSelect').value = specialInterval;
    document.getElementById('modeSelect').value = mode;
    document.getElementById('speechToggle').value = speechEnabled;
    updateModeUI();
    updateRoundBadge();
    resetTimerDisplay();

    // --- WEB AUDIO API ---
    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSpecialAlert() {
      ensureAudio();
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.09);
        gain.gain.setValueAtTime(0.22, audioCtx.currentTime + i * 0.09);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.09 + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.09);
        osc.stop(audioCtx.currentTime + i * 0.09 + 0.18);
      });
    }

    function playTick(high = false) {
      ensureAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(high ? 980 : 620, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playBuzzer() {
      ensureAudio();
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.type = 'sawtooth';
      osc2.type = 'square';
      osc1.frequency.setValueAtTime(145, audioCtx.currentTime);
      osc2.frequency.setValueAtTime(152, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.65);
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);
      osc1.start();
      osc2.start();
      osc1.stop(audioCtx.currentTime + 0.65);
      osc2.stop(audioCtx.currentTime + 0.65);
    }

    // --- ZUVERLÄSSIGE iOS-SPRACHAUSGABE IN ETAPPEN ---
    function speakSequence(phrases, onAllDone) {
      clearInterval(speechPollInterval);
      activeSpeechId++;
      const myId = activeSpeechId;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      if (speechEnabled !== 'on' || !('speechSynthesis' in window) || phrases.length === 0) {
        if (onAllDone) onAllDone();
        return;
      }

      setTimeout(() => {
        if (myId !== activeSpeechId) return;

        const voices = window.speechSynthesis.getVoices();
        const deVoice = voices.find(v => v.lang.startsWith('de') && v.localService) || voices.find(v => v.lang.startsWith('de'));

        phrases.forEach((phrase) => {
          const utter = new SpeechSynthesisUtterance(phrase);
          utter.lang = 'de-DE';
          utter.rate = 1.04;
          utter.pitch = 1.0;
          if (deVoice) utter.voice = deVoice;
          window.speechSynthesis.speak(utter);
        });

        let hasStartedSpeaking = false;
        const startTime = Date.now();
        const totalChars = phrases.join(' ').length;
        const maxHardTimeout = Math.max(4000, totalChars * 110 + 2500);

        speechPollInterval = setInterval(() => {
          if (myId !== activeSpeechId) {
            clearInterval(speechPollInterval);
            return;
          }

          const isSpeaking = window.speechSynthesis.speaking || window.speechSynthesis.pending;
          if (isSpeaking) {
            hasStartedSpeaking = true;
          }

          const elapsed = Date.now() - startTime;

          if ((hasStartedSpeaking && !isSpeaking) || (!hasStartedSpeaking && elapsed > 1500) || elapsed > maxHardTimeout) {
            clearInterval(speechPollInterval);
            if (myId === activeSpeechId && onAllDone) {
              setTimeout(() => {
                if (myId === activeSpeechId) onAllDone();
              }, 250);
            }
          }
        }, 150);
      }, 80);
    }

    // --- POOLS ---
    function getActivePool() {
      let pool = [];
      if (mode === 'standard') {
        pool = STANDARD_CATEGORIES.map(c => ({ text: c, adult: false }));
      } else if (mode === 'adult') {
        pool = ADULT_CATEGORIES.map(c => ({ text: c, adult: true }));
      } else {
        pool = [
          ...STANDARD_CATEGORIES.map(c => ({ text: c, adult: false })),
          ...ADULT_CATEGORIES.map(c => ({ text: c, adult: true }))
        ];
      }
      customCategories.forEach(c => pool.push({ text: c, adult: false }));
      return pool;
    }

    function getRandomSpecial() {
      if (usedSpecialIndices.size >= SPECIAL_CHALLENGES.length) {
        usedSpecialIndices.clear();
      }
      let idx;
      do {
        idx = Math.floor(Math.random() * SPECIAL_CHALLENGES.length);
      } while (usedSpecialIndices.has(idx) && usedSpecialIndices.size < SPECIAL_CHALLENGES.length);
      usedSpecialIndices.add(idx);
      return SPECIAL_CHALLENGES[idx];
    }

    function updatePoolStats() {
      const pool = getActivePool();
      document.getElementById('poolStats').textContent = `Verfügbar: ${pool.length - usedIndices.size} von ${pool.length} Kategorien`;
    }

    function updateRoundBadge() {
      const rb = document.getElementById('roundBadge');
      if (specialInterval <= 0) {
        rb.textContent = `Runde ${roundCount}`;
        return;
      }
      const rem = specialInterval - (roundCount % specialInterval);
      if (roundCount > 0 && roundCount % specialInterval === 0) {
        rb.textContent = `Runde ${roundCount} • ⚡ SPEZIAL!`;
      } else {
        rb.textContent = `Runde ${roundCount} • Spezial in ${rem}`;
      }
    }

    // --- SPIELABLAUF ---
    function nextRound() {
      ensureAudio();
      stopAll(false);

      roundCount++;
      updateRoundBadge();

      const isSpecialRound = specialInterval > 0 && (roundCount % specialInterval === 0);
      const specialBox = document.getElementById('specialBox');
      const specialTextEl = document.getElementById('specialText');

      if (isSpecialRound) {
        currentSpecial = getRandomSpecial();
        specialTextEl.textContent = currentSpecial;
        specialBox.classList.add('visible');
        playSpecialAlert();
      } else {
        currentSpecial = "";
        specialBox.classList.remove('visible');
      }

      const pool = getActivePool();
      if (usedIndices.size >= pool.length) {
        usedIndices.clear();
      }

      let idx;
      do {
        idx = Math.floor(Math.random() * pool.length);
      } while (usedIndices.has(idx) && usedIndices.size < pool.length);

      usedIndices.add(idx);
      const chosen = pool[idx];
      currentCategory = chosen.text;

      const catTextEl = document.getElementById('categoryText');
      const badgeEl = document.getElementById('categoryBadge');
      const boxEl = document.getElementById('categoryBox');

      catTextEl.textContent = chosen.text;
      boxEl.classList.remove('pulse', 'shake', 'speaking');
      void boxEl.offsetWidth;
      boxEl.classList.add('pulse');

      if (chosen.adult) {
        badgeEl.textContent = "🔥 Ü18 Kategorie";
        badgeEl.classList.add('adult');
      } else {
        badgeEl.textContent = "Kategorie";
        badgeEl.classList.remove('adult');
      }

      updatePoolStats();
      resetTimerDisplay();

      const speechQueue = isSpecialRound
        ? ["Achtung Spezialrunde!", currentSpecial, `Die Kategorie lautet: ${chosen.text}`]
        : [chosen.text];

      if (speechEnabled === 'on') {
        boxEl.classList.add('speaking');
        document.getElementById('timerStatus').textContent = "Hör gut zu...";
        const mainBtn = document.getElementById('mainBtn');
        mainBtn.textContent = "🗣️ Ansage läuft...";
        mainBtn.classList.remove('running');
        mainBtn.classList.add('speaking-state');

        speakSequence(speechQueue, () => {
          boxEl.classList.remove('speaking');
          mainBtn.classList.remove('speaking-state');
          startTimer();
        });
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timeLeft = duration;
      const mainBtn = document.getElementById('mainBtn');
      mainBtn.textContent = "⏭ Nächste Runde (läuft...)";
      mainBtn.classList.remove('speaking-state');
      mainBtn.classList.add('running');
      document.getElementById('timerStatus').textContent = "Karten legen!";

      let lastWholeSecond = Math.ceil(timeLeft);
      const step = 0.05;

      updateRing(timeLeft, duration);

      timerInterval = setInterval(() => {
        timeLeft = Math.max(0, +(timeLeft - step).toFixed(2));
        document.getElementById('timerSeconds').textContent = timeLeft.toFixed(1);
        updateRing(timeLeft, duration);

        const currentWhole = Math.ceil(timeLeft);
        if (currentWhole < lastWholeSecond && currentWhole > 0) {
          lastWholeSecond = currentWhole;
          playTick(currentWhole <= 3);
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          onTimeUp();
        }
      }, step * 1000);
    }

    function onTimeUp() {
      playBuzzer();
      if (navigator.vibrate) navigator.vibrate([200, 100, 300]);
      document.getElementById('timerStatus').textContent = "ZEIT UM!";
      document.getElementById('categoryBox').classList.add('shake');
      const mainBtn = document.getElementById('mainBtn');
      mainBtn.textContent = "▶ Nächste Runde";
      mainBtn.classList.remove('running', 'speaking-state');
    }

    function stopAll(resetText = true) {
      activeSpeechId++;
      clearInterval(speechPollInterval);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      document.getElementById('categoryBox').classList.remove('speaking');
      if (resetText) {
        resetTimerDisplay();
        const mainBtn = document.getElementById('mainBtn');
        mainBtn.textContent = "▶ Nächste Runde";
        mainBtn.classList.remove('running', 'speaking-state');
      }
    }

    function resetTimerDisplay() {
      timeLeft = duration;
      document.getElementById('timerSeconds').textContent = duration.toFixed(1);
      document.getElementById('timerStatus').textContent = "Sekunden";
      updateRing(duration, duration);
    }

    function updateRing(current, total) {
      const fraction = current / total;
      const offset = circumference - fraction * circumference;
      circle.style.strokeDashoffset = offset;
      circle.style.stroke = (current <= 3) ? '#f43f5e' : '#38bdf8';
    }

    function repeatSpeech() {
      if (!currentCategory) return;
      const queue = currentSpecial
        ? ["Spezialrunde:", currentSpecial, `Kategorie: ${currentCategory}`]
        : [currentCategory];
      speakSequence(queue, null);
    }

    // --- MODUS & SETTINGS ---
    function cycleMode() {
      const order = ['standard', 'mixed', 'adult'];
      mode = order[(order.indexOf(mode) + 1) % order.length];
      document.getElementById('modeSelect').value = mode;
      localStorage.setItem('nonstop_mode', mode);
      usedIndices.clear();
      updateModeUI();
    }

    function updateModeUI() {
      const btn = document.getElementById('adultToggleBtn');
      if (mode === 'standard') {
        btn.textContent = "Standard";
        btn.classList.remove('active-adult');
      } else if (mode === 'mixed') {
        btn.textContent = "+ Ü18";
        btn.classList.add('active-adult');
      } else {
        btn.textContent = "Nur Ü18";
        btn.classList.add('active-adult');
      }
      updatePoolStats();
    }

    function openSettings() {
      document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    function closeSettingsOnBackdrop(e) {
      if (e.target.id === 'settingsModal') closeSettings();
    }

    function saveSettings() {
      duration = parseInt(document.getElementById('durationSelect').value, 10);
      specialInterval = parseInt(document.getElementById('specialIntervalSelect').value, 10);
      const newMode = document.getElementById('modeSelect').value;
      speechEnabled = document.getElementById('speechToggle').value;

      localStorage.setItem('nonstop_duration', duration);
      localStorage.setItem('nonstop_special_int', specialInterval);
      localStorage.setItem('nonstop_mode', newMode);
      localStorage.setItem('nonstop_speech', speechEnabled);

      if (newMode !== mode) {
        mode = newMode;
        usedIndices.clear();
      }
      updateModeUI();
      updateRoundBadge();
      if (!timerInterval) resetTimerDisplay();
    }

    function addCustomCategory() {
      const input = document.getElementById('customCatInput');
      const val = input.value.trim();
      if (!val) return;
      customCategories.push(val);
      localStorage.setItem('nonstop_custom', JSON.stringify(customCategories));
      input.value = '';
      updatePoolStats();
      alert(`„${val}“ wurde hinzugefügt!`);
    }

    function resetUsedPool() {
      stopAll(true);
      usedIndices.clear();
      usedSpecialIndices.clear();
      roundCount = 0;
      currentSpecial = "";
      document.getElementById('specialBox').classList.remove('visible');
      updateRoundBadge();
      updatePoolStats();
      closeSettings();
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  </script>
